<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryme Notes</title>
<meta name="theme-color" content="#050b1d">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<script src="theme.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23a29bfe'/%3E%3Cstop offset='1' stop-color='%235b4cf0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --line:#e9ecf3; --text:#1f2333; --muted:#8a90a2; --soft:#b6bccb;
  --brand:#5b5ff0; --brand2:#4f8cf7;
  --purple:#a678f5; --purple2:#8e5cf0; --blue:#7c9cf6; --blue2:#4a7cf0;
  --yellow:#fdc54a; --yellow2:#fb9a2c; --pink:#f77ad6; --pink2:#ef4f8e;
  --green:#4fc68a; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:var(--text);
  background:linear-gradient(135deg,#bcd3ff 0%,#9aa8ff 50%,#7c6cf5 100%);
  display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.app{width:100%;height:100%;max-width:1500px;background:var(--bg);border-radius:28px;display:flex;overflow:hidden;
  box-shadow:0 30px 80px rgba(60,50,160,.35)}
@media (display-mode: standalone),(max-width:900px){body{padding:0}.app{border-radius:0;max-width:none}}

/* sidebar */
.side{width:230px;flex-shrink:0;background:#fff;padding:26px 0;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:0 24px 30px;font-weight:600;font-size:20px}
.orb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c9c3ff,#6a5cf3 60%,#5048e5);
  box-shadow:0 0 14px rgba(108,92,231,.6)}
.navlabel{font-size:11px;color:var(--muted);padding:14px 24px 6px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 24px;font-size:14px;color:#4b5064;position:relative;width:100%;text-align:left}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
.nav:hover{color:var(--brand)}
.nav.active{color:var(--text);font-weight:600}
.nav.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav .count{margin-left:auto;background:var(--brand);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;font-weight:600}
.nav .dot{width:10px;height:10px;border-radius:3px}
.nbnav .count{background:#eef0f7;color:var(--muted)}
.side .grow{flex:1}
.user{display:flex;align-items:center;gap:10px;padding:0 24px;font-weight:600;font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#5b5ff0,#1f2333);color:#fff;display:grid;place-items:center;font-size:13px}

/* main */
.main{flex:1;overflow-y:auto;padding:26px 28px 40px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.top h1{font-size:22px;font-weight:700;flex:1}
.search{background:#fff;border-radius:22px;padding:9px 16px;border:1px solid var(--line);width:240px;outline:none;font-size:13px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;border:1px solid var(--line)}
.iconbtn svg{width:18px;height:18px;stroke:#4b5064;fill:none;stroke-width:1.7}
.primary{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;border-radius:20px;padding:9px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 16px rgba(91,95,240,.3)}
.ghost{background:#fff;border-radius:20px;padding:8px 16px;font-size:13px;border:1px solid var(--line)}
h2{font-size:19px;font-weight:700}
.sechead{display:flex;align-items:center;gap:10px;margin:26px 0 14px}
.sechead h2{flex:1}

/* notebook cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}
.nb{border-radius:var(--radius);color:#fff;padding:14px 14px 0;position:relative;overflow:hidden;cursor:pointer;min-height:96px;display:flex;flex-direction:column;transition:transform .15s}
.nb:hover{transform:translateY(-2px)}
.nb .meta{display:flex;align-items:center;gap:6px;font-size:11px}
.nb .pill{background:rgba(255,255,255,.9);color:#1f2333;border-radius:10px;padding:1px 7px;font-weight:600}
.nb b{font-size:15px;margin-top:6px;display:block}
.nb small{font-size:11.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-bottom:10px}
.nb .bar{height:12px;margin:auto -14px 0;background:rgba(255,255,255,.35)}
.nb .bar i{display:block;height:100%}
.nb .menu{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.nb .menu:hover{background:rgba(255,255,255,.25)}
.c-purple{background:linear-gradient(135deg,#b98cfa,var(--purple))}.c-purple .bar i{background:var(--purple2)}
.c-blue{background:linear-gradient(135deg,#94b0fa,var(--blue))}.c-blue .bar i{background:linear-gradient(90deg,#5a6ff0,#3da0f0)}
.c-yellow{background:linear-gradient(135deg,#fdd060,var(--yellow))}.c-yellow .bar i{background:linear-gradient(90deg,#fda22c,#fb8a3c)}
.c-pink{background:linear-gradient(135deg,#fa8fe0,var(--pink))}.c-pink .bar i{background:linear-gradient(90deg,#ef4fa0,#f25a6a)}
.c-green{background:linear-gradient(135deg,#7fdcab,var(--green))}.c-green .bar i{background:#2fa86c}
.c-slate{background:linear-gradient(135deg,#8d95ad,#6b7390)}.c-slate .bar i{background:#4a5170}
.nb.add{background:#fff;color:var(--muted);border:2px dashed var(--line);align-items:center;justify-content:center;padding:14px;font-weight:600;font-size:14px}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:14px}
.col{background:#fff;border-radius:var(--radius);padding:16px;min-height:150px;display:flex;flex-direction:column}
.col.over{outline:2px dashed var(--brand);outline-offset:-4px}
.colhead{display:flex;align-items:center;font-weight:600;font-size:15px;margin-bottom:12px}
.colhead span{flex:1}
.colhead em{font-style:normal;font-size:11px;color:var(--muted);background:#f0f2f8;border-radius:10px;padding:2px 8px;margin-right:6px}
.task{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:10px;font-size:12.5px;color:#4b5064;cursor:grab;position:relative}
.task:hover{background:#f6f7fb}
.task.dragging{opacity:.4}
.badge{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:600}
.task .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .x{opacity:0;color:var(--soft);font-size:16px;padding:0 4px}
.task:hover .x{opacity:1}
.task .ok{width:16px;height:16px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex-shrink:0}
.task .ok svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3}
.addtask{margin-top:auto;padding-top:8px}
.addtask input{width:100%;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;outline:none;background:#fafbfe}
.addtask input:focus{border-color:var(--brand);border-style:solid}
.colfoot{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:11px}
.colfoot .star{margin-left:auto;color:#f7b42c;font-size:18px}

/* tabs */
.tabs{display:flex;gap:8px}
.tab{background:#fff;border-radius:18px;padding:7px 22px;font-size:12.5px}
.tab.on{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff}

/* planner */
.planner{background:#fff;border-radius:var(--radius);padding:16px 18px 18px;overflow-x:auto}
.grid{display:grid;grid-template-columns:60px repeat(7,minmax(105px,1fr));position:relative;min-width:820px}
.dayh{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0 14px;line-height:1.5}
.dayh.today{color:var(--text);font-weight:700}
.time{font-size:12px;color:#4b5064;height:56px;padding-top:2px}
.cell{height:56px;border-top:1px solid #f2f3f8;position:relative;cursor:copy}
.cell:hover{background:#fafbff}
.cell.todaycol{background:repeating-linear-gradient(115deg,#f7f8fc 0 22px,#f1f3f9 22px 44px)}
.ev{position:absolute;left:4px;right:4px;border-radius:12px;color:#fff;padding:8px 9px 0;font-size:11.5px;font-weight:500;overflow:hidden;z-index:2;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.ev .h{display:flex;align-items:center;gap:4px;font-size:10px;opacity:.95;margin-bottom:4px}
.ev .bar{height:10px;margin:auto -9px 0;background:rgba(255,255,255,.35)}
.ev .bar i{display:block;height:100%;width:45%}
.nowline{position:absolute;left:52px;right:0;height:2px;background:var(--brand);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--brand)}

/* notes view */
.notesview{display:grid;grid-template-columns:300px 1fr;gap:16px;height:calc(100vh - 160px);min-height:420px}
.notelist{background:#fff;border-radius:var(--radius);padding:10px;overflow-y:auto}
.noteitem{padding:12px;border-radius:12px;cursor:pointer;border-left:4px solid transparent;margin-bottom:4px}
.noteitem:hover{background:#f6f7fb}
.noteitem.sel{background:#f0f1ff}
.noteitem b{font-size:13.5px;display:flex;gap:6px;align-items:center}
.noteitem p{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.noteitem .d{font-size:10.5px;color:var(--soft);margin-top:4px}
.editor{background:#fff;border-radius:var(--radius);padding:22px 26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.editor .title{font-size:24px;font-weight:700;border:none;outline:none;width:100%}
.editor .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.editor select{border:1px solid var(--line);border-radius:14px;padding:5px 10px;font-size:12px;background:#fafbfe;outline:none}
.editor textarea{flex:1;border:none;outline:none;resize:none;font-size:14.5px;line-height:1.7;color:#30354a}
.empty{display:grid;place-items:center;color:var(--muted);text-align:center;font-size:14px;height:100%}
.pinbtn{font-size:18px;color:var(--soft)}.pinbtn.on{color:#f7b42c}
.del{color:#e5546e;font-size:12px;margin-left:auto}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;transition:transform .15s}
.stat:hover{transform:translateY(-2px)}
.stat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.stat .ic svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.9}
.stat b{font-size:24px;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;min-width:0}
.phead{display:flex;align-items:center;margin-bottom:10px}.phead h2{flex:1;font-size:16px}
.ghost.sm{padding:5px 12px;font-size:12px;background:transparent}
.trow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;font-size:13.5px}
.trow:hover{background:rgba(120,130,200,.08)}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--soft);flex-shrink:0;display:grid;place-items:center;cursor:pointer;transition:.15s}
.chk:hover{border-color:var(--green);background:rgba(79,198,138,.15)}
.chk svg{width:12px;height:12px;stroke:var(--green);fill:none;stroke-width:3;opacity:0}.chk:hover svg{opacity:1}
.trow .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:10.5px;font-weight:600;border-radius:8px;padding:3px 8px;flex-shrink:0}
.chip.todo{background:rgba(124,156,246,.18);color:#7c9cf6}.chip.doing{background:rgba(253,197,74,.18);color:#e9a92a}.chip.review{background:rgba(247,122,214,.18);color:#e66bc4}
.ndot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.erow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;font-size:13.5px}
.erow:hover{background:rgba(120,130,200,.08)}
.erow .tm{font-size:12px;color:var(--muted);width:92px;flex-shrink:0;font-variant-numeric:tabular-nums}
.erow .bar2{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0}
.erow.now{background:rgba(109,125,255,.12)}
.erow.past{opacity:.5}
.emptyp{padding:22px 8px;text-align:center;color:var(--muted);font-size:13px}
.quick{margin-top:auto;width:100%;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:transparent;color:var(--text);text-align:left}
.quick:focus{border-style:solid;border-color:var(--brand)}
.qbtn{color:var(--muted)}.qbtn:hover{color:var(--brand);border-color:var(--brand)}
#taskList,#todayList{margin-bottom:10px;min-height:120px}
.nrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;cursor:pointer}
.nrow:hover{background:rgba(120,130,200,.08)}
.nrow .nt{flex:1;min-width:0}
.nrow b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.nrow .nm{font-size:11.5px;color:var(--muted);flex-shrink:0;text-align:right}
.cards .nb{min-height:88px}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.duo{grid-template-columns:1fr}}
/* recent notes on dashboard */
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.rnote{background:#fff;border-radius:var(--radius);padding:16px;cursor:pointer;border-top:4px solid var(--brand);min-height:120px}
.rnote:hover{box-shadow:0 8px 20px rgba(60,60,120,.08)}
.rnote b{font-size:14px}
.rnote p{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,30,60,.35);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:20px;padding:24px;width:380px;max-width:92vw;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.sheet h3{font-size:17px}
.sheet label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.sheet input,.sheet select,.sheet textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;outline:none;background:#fafbfe}
.sheet input:focus,.sheet textarea:focus{border-color:var(--brand)}
.swatches{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.sw.on{border-color:var(--text)}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.sheet .btns .danger{color:#e5546e;margin-right:auto;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1f2333;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;transition:.25s;z-index:60}
.toast.show{transform:translateX(-50%) translateY(0)}
.hint{font-size:12px;color:var(--muted)}
.view{display:none}.view.on{display:block}
/* lock screen */
.lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%,#13265e 0%,#060f28 45%,#02060f 100%)}
.lock.hide{display:none}
.lockcard{width:360px;max-width:92vw;background:rgba(10,22,49,.85);border:1px solid #1c2e5c;border-radius:24px;padding:34px 30px;
  display:flex;flex-direction:column;align-items:center;gap:12px;color:#e8edff;box-shadow:0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.lockcard .orb{width:62px;height:62px;margin-bottom:6px;box-shadow:0 0 34px rgba(120,110,255,.7)}
.lockcard h2{font-size:21px}
.lockcard p{font-size:13px;color:#8e9cc4;text-align:center;line-height:1.5}
.lockcard input{width:100%;background:#060f26;border:1px solid #1c2e5c;border-radius:12px;padding:12px 14px;color:#e8edff;font-size:15px;outline:none}
.lockcard input:focus{border-color:#6d7dff}
.lockcard .primary{width:100%;padding:12px;font-size:14px;margin-top:4px}
.lockcard .err{color:#ff7a93;font-size:12.5px;min-height:16px}
.lockcard .link{font-size:12px;color:#7f8db5;text-decoration:underline;margin-top:4px}
.lockcard .who{font-size:13px;color:#aab6da;display:flex;align-items:center;gap:8px}
.pwrap{position:relative;width:100%}.pwrap input{width:100%;padding-right:44px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.55;padding:4px}.eye:hover{opacity:1}
.meter{display:flex;gap:4px;width:100%;margin-top:-4px}.meter i{flex:1;height:4px;border-radius:3px;background:rgba(140,150,200,.25)}
.mtxt{font-size:11px;color:#8e9cc4;width:100%;margin-top:-6px;min-height:13px}
.shield{font-size:11.5px;color:#6f7fa8}
.secrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}.secrow b{color:var(--text);font-weight:600}
.chkrow{flex-direction:row!important;align-items:center;gap:8px!important;font-size:13px!important;color:var(--text)!important}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* theme switch */
.themesw{display:flex;align-items:center;gap:12px;padding:10px 24px;font-size:14px;color:#4b5064;width:100%;text-align:left}
.themesw .knob{margin-left:auto;width:36px;height:20px;border-radius:12px;background:#dfe2ec;position:relative;transition:.2s;flex-shrink:0}
.themesw .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.themesw svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}

/* ===== NAVY DARK THEME ===== */
html[data-theme=dark]{color-scheme:dark;
  --bg:#050b1d; --panel:#0a1631; --line:#16264d; --text:#e8edff; --muted:#7f8db5; --soft:#4d5b85;
}
html[data-theme=dark] body{background:linear-gradient(135deg,#02060f 0%,#060f28 55%,#0c1a45 100%)}
html[data-theme=dark] .app{box-shadow:0 30px 80px rgba(0,0,20,.6)}
html[data-theme=dark] .side{background:#071027;border-right:1px solid #111f42}
html[data-theme=dark] .nav,html[data-theme=dark] .themesw{color:#aab6da}
html[data-theme=dark] .nav:hover{color:#8fa2ff}
html[data-theme=dark] .nav.active{color:#fff}
html[data-theme=dark] .nav.active::before{background:#6d7dff;box-shadow:0 0 10px #6d7dff}
html[data-theme=dark] .nbnav .count{background:#12214a;color:#aab6da}
html[data-theme=dark] .themesw .knob{background:#5b5ff0}
html[data-theme=dark] .themesw .knob::after{left:18px}
html[data-theme=dark] .search,html[data-theme=dark] .iconbtn,html[data-theme=dark] .ghost,html[data-theme=dark] .tab:not(.on),
html[data-theme=dark] .col,html[data-theme=dark] .planner,html[data-theme=dark] .notelist,html[data-theme=dark] .editor,
html[data-theme=dark] .rnote,html[data-theme=dark] .sheet{background:var(--panel);border-color:var(--line);color:var(--text)}
html[data-theme=dark] .col,html[data-theme=dark] .planner,html[data-theme=dark] .notelist,html[data-theme=dark] .editor,html[data-theme=dark] .rnote{border:1px solid #13234a}
html[data-theme=dark] .nb.add{background:transparent;border-color:#1c2e5c;color:var(--muted)}
html[data-theme=dark] .task{color:#c6d0ee}
html[data-theme=dark] .task:hover,html[data-theme=dark] .noteitem:hover{background:#0f1e42}
html[data-theme=dark] .noteitem.sel{background:#14275a}
html[data-theme=dark] .colhead em{background:#12214a;color:#aab6da}
html[data-theme=dark] .addtask input,html[data-theme=dark] .sheet input,html[data-theme=dark] .sheet select,html[data-theme=dark] .sheet textarea,html[data-theme=dark] .editor select{background:#060f26;border-color:#1c2e5c;color:var(--text)}
html[data-theme=dark] .editor .title,html[data-theme=dark] .editor textarea{background:transparent;color:var(--text)}
html[data-theme=dark] .editor textarea{color:#cdd6f4}
html[data-theme=dark] .time{color:#aab6da}
html[data-theme=dark] .cell{border-top-color:#111f42}
html[data-theme=dark] .cell:hover{background:#0f1d40}
html[data-theme=dark] .cell.todaycol{background:repeating-linear-gradient(115deg,#0b1834 0 22px,#0e1c3d 22px 44px)}
html[data-theme=dark] .nowline,html[data-theme=dark] .nowline::before{background:#7b8cff}
html[data-theme=dark] .sw.on{border-color:#fff}
html[data-theme=dark] .modal{background:rgba(2,6,20,.6)}
html[data-theme=dark] .toast{background:#5b5ff0}
html[data-theme=dark] .nb{box-shadow:0 8px 22px rgba(0,0,0,.25)}
html[data-theme=dark] .ev{box-shadow:0 4px 14px rgba(0,0,0,.3)}
html[data-theme=dark] ::-webkit-scrollbar{width:10px;height:10px}
html[data-theme=dark] ::-webkit-scrollbar-thumb{background:#22346a;border-radius:8px}
html[data-theme=dark] ::-webkit-scrollbar-track{background:transparent}
@media (max-width:900px){.side{width:64px}.side .lbl,.navlabel,.logo span,.user span,.nav .count{display:none}.logo{padding:0 19px 30px}.nav{padding:12px 22px}.board{grid-template-columns:repeat(2,1fr)}.notesview{grid-template-columns:1fr}.search{width:140px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="orb"></div><span>Ryme Notes</span></div>
    <div class="navlabel">Main</div>
    <button class="nav active" data-view="home"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span class="lbl">Dashboard</span></button>
    <button class="nav" data-view="notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/></svg><span class="lbl">Notes</span><span class="count" id="noteCount">0</span></button>
    <button class="nav" data-view="board"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg><span class="lbl">Task Board</span></button>
    <button class="nav" data-view="planner"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="lbl">Planner</span></button>
    <div class="navlabel">Notebooks</div>
    <div id="nbNav"></div>
    <div class="grow"></div>
    <button class="nav" id="secBtn"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span class="lbl">Security</span></button>
    <button class="nav" id="lockBtn"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="lbl">Lock</span></button>
    <button class="themesw" id="themeBtn"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span class="lbl">Dark mode</span><span class="knob"></span></button>
    <button class="nav" id="backupBtn"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg><span class="lbl">Backup / Restore</span></button>
    <div style="height:14px"></div>
    <div class="user"><div class="avatar">RJ</div><span>Ryan James Lim</span></div>
  </aside>

  <main class="main">
    <div class="top">
      <h1 id="pageTitle">Dashboard</h1>
      <input class="search" id="search" placeholder="Search notes…">
      <button class="primary" id="newNoteBtn">+ New note</button>
    </div>

    <!-- HOME -->
    <section class="view on" id="v-home">
      <p class="hint" id="todayLine" style="margin:-8px 0 18px;font-size:13px"></p>
      <div class="stats" id="stats"></div>
      <div class="duo">
        <div class="panel">
          <div class="phead"><h2>My Tasks</h2><button class="ghost sm" data-go="board">Open board →</button></div>
          <div id="taskList"></div>
          <input class="quick" id="quickTask" placeholder="+ Add a task and press Enter">
        </div>
        <div class="panel">
          <div class="phead"><h2>Today's Schedule</h2><button class="ghost sm" data-go="planner">Open planner →</button></div>
          <div id="todayList"></div>
          <button class="quick qbtn" id="quickEvent">+ Add to today's schedule</button>
        </div>
      </div>
      <div class="sechead"><h2>Notebooks</h2></div>
      <div class="cards" id="nbCards"></div>
      <div class="sechead"><h2>Recent Notes</h2><button class="ghost sm" data-go="notes">All notes →</button></div>
      <div class="panel" style="padding:6px"><div id="recent"></div></div>
    </section>

    <!-- NOTES -->
    <section class="view" id="v-notes">
      <div class="notesview">
        <div class="notelist" id="noteList"></div>
        <div class="editor" id="editor"></div>
      </div>
    </section>

    <!-- BOARD -->
    <section class="view" id="v-board">
      <p class="hint" style="margin-bottom:12px">Drag tasks between columns. Type in a column's box and press Enter to add a task.</p>
      <div class="board" id="boardFull"></div>
    </section>

    <!-- PLANNER -->
    <section class="view" id="v-planner">
      <div class="sechead" style="margin-top:0"><h2 id="weekLabel"></h2>
        <div class="tabs"><button class="tab" id="prevWk">‹ Prev</button><button class="tab on" id="thisWk">This week</button><button class="tab" id="nextWk">Next ›</button></div>
      </div>
      <p class="hint" style="margin-bottom:12px">Click an empty slot to add a schedule block. Click a block to edit it.</p>
      <div class="planner"><div class="grid" id="gridFull"></div></div>
    </section>
  </main>
</div>

<!-- modals -->
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="lock" id="lock"><form class="lockcard" id="lockForm" autocomplete="off"></form></div>

<script src="app.js"></script>
</body>
</html>
